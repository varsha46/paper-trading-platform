name: Paper Trading API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: paper-trading-api
  ECR_REGISTRY: 650675165189.dkr.ecr.eu-north-1.amazonaws.com
  EC2_INSTANCE_ID: i-0608a6529ac4d0d1f

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::650675165189:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            backend

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2 through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          set -euo pipefail
          AWS_REGION="${AWS_REGION}"
          ECR_REGISTRY="${ECR_REGISTRY}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          ENV_FILE="/home/ec2-user/paper-trading-platform/backend/.env"

          if [ ! -f "\$ENV_FILE" ]; then
            echo "Production environment file is missing."
            exit 1
          fi

          aws ecr get-login-password --region "\$AWS_REGION" | docker login --username AWS --password-stdin "\$ECR_REGISTRY"
          docker pull "\$IMAGE_URI"

          docker rm -f paper-trading-api-test >/dev/null 2>&1 || true
          docker run -d --name paper-trading-api-test --restart no --env-file "\$ENV_FILE" -p 127.0.0.1:8001:8000 "\$IMAGE_URI"

          check_health() {
            local port="\$1"
            for attempt in \$(seq 1 20); do
              if curl -fsS "http://127.0.0.1:\${port}/" >/dev/null && curl -fsS "http://127.0.0.1:\${port}/stocks" >/dev/null; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          if ! check_health 8001; then
            docker logs --tail 60 paper-trading-api-test || true
            docker rm -f paper-trading-api-test >/dev/null 2>&1 || true
            exit 1
          fi

          docker rm -f paper-trading-api-test >/dev/null 2>&1 || true

          rollback_systemd() {
            echo "Deployment failed; restoring systemd service."
            docker rm -f paper-trading-api >/dev/null 2>&1 || true
            sudo systemctl enable paper-trading-api >/dev/null 2>&1 || true
            sudo systemctl start paper-trading-api
          }

          if ! sudo systemctl stop paper-trading-api; then
            echo "Could not stop the existing systemd API."
            exit 1
          fi

          docker rm -f paper-trading-api >/dev/null 2>&1 || true

          if ! docker run -d --name paper-trading-api --restart unless-stopped --env-file "\$ENV_FILE" -p 127.0.0.1:8000:8000 "\$IMAGE_URI"; then
            rollback_systemd
            exit 1
          fi

          if ! check_health 8000; then
            docker logs --tail 60 paper-trading-api || true
            rollback_systemd
            exit 1
          fi

          if ! sudo systemctl disable paper-trading-api; then
            rollback_systemd
            exit 1
          fi

          echo "Deployment successful: \$IMAGE_URI"
          EOF
          )

          PARAMETERS=$(jq -n --arg cmd "$DEPLOY_SCRIPT" '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Paper Trading API $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          STATUS="Pending"
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi