name: Paper Trading Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: paper-trading-frontend
  ECR_REGISTRY: 650675165189.dkr.ecr.eu-north-1.amazonaws.com
  EC2_INSTANCE_ID: i-0608a6529ac4d0d1f

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::650675165189:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            frontend

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy frontend through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          set -euo pipefail

          AWS_REGION="${AWS_REGION}"
          ECR_REGISTRY="${ECR_REGISTRY}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          aws ecr get-login-password --region "\$AWS_REGION" |
            docker login --username AWS --password-stdin "\$ECR_REGISTRY"

          docker pull "\$IMAGE_URI"

          OLD_IMAGE=""
          if docker inspect paper-trading-frontend >/dev/null 2>&1; then
            OLD_IMAGE=\$(docker inspect --format='{{.Config.Image}}' paper-trading-frontend)
          fi

          check_health() {
            local port="\$1"
            for attempt in \$(seq 1 20); do
              if curl -fsS "http://127.0.0.1:\${port}/health" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          # Test the new image on an unused port first.
          docker rm -f paper-trading-frontend-candidate >/dev/null 2>&1 || true

          if ! docker run -d \
            --name paper-trading-frontend-candidate \
            --restart no \
            -p 127.0.0.1:8082:80 \
            "\$IMAGE_URI"; then
            exit 1
          fi

          if ! check_health 8082; then
            docker logs --tail 50 paper-trading-frontend-candidate || true
            docker rm -f paper-trading-frontend-candidate >/dev/null 2>&1 || true
            exit 1
          fi

          docker rm -f paper-trading-frontend-candidate >/dev/null 2>&1 || true
          docker rm -f paper-trading-frontend >/dev/null 2>&1 || true

          if ! docker run -d \
            --name paper-trading-frontend \
            --restart unless-stopped \
            -p 127.0.0.1:8081:80 \
            "\$IMAGE_URI"; then

            if [ -n "\$OLD_IMAGE" ]; then
              docker run -d \
                --name paper-trading-frontend \
                --restart unless-stopped \
                -p 127.0.0.1:8081:80 \
                "\$OLD_IMAGE" || true
            fi
            exit 1
          fi

          if ! check_health 8081; then
            docker logs --tail 50 paper-trading-frontend || true
            docker rm -f paper-trading-frontend >/dev/null 2>&1 || true

            if [ -n "\$OLD_IMAGE" ]; then
              docker run -d \
                --name paper-trading-frontend \
                --restart unless-stopped \
                -p 127.0.0.1:8081:80 \
                "\$OLD_IMAGE" || true
            fi
            exit 1
          fi

          echo "Frontend deployment successful: \$IMAGE_URI"
          EOF
          )

          PARAMETERS=$(jq -n --arg cmd "$DEPLOY_SCRIPT" '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          STATUS="Pending"
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            echo "Frontend deployment failed: $STATUS"
            exit 1
          fi